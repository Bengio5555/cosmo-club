<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="6" fill="#0A0A0A"/>
  <!-- coupe bowl: liquid -->
  <path d="M5 9 Q16 18 27 9 Z" fill="#8B1A1A"/>
  <!-- bowl rim + outer curve -->
  <path d="M5 9 H27 M5 9 Q16 18 27 9" fill="none" stroke="#C9A961" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- stem -->
  <line x1="16" y1="18" x2="16" y2="25" stroke="#C9A961" stroke-width="1.5" stroke-linecap="round"/>
  <!-- base -->
  <line x1="11" y1="25.5" x2="21" y2="25.5" stroke="#C9A961" stroke-width="1.75" stroke-linecap="round"/>
  <!-- cherry/garnish on rim -->
  <circle cx="22" cy="8" r="1.75" fill="#C9A961"/>
</svg>
